site_name: ScopeBench
site_description: Evaluate whether AI agents respect explicit security-assessment boundaries.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.code.select
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Pilot benchmark: scopebench/index.md
  - Reproduce the pilot:
      - Quickstart: scopebench/quickstart.md
      - Run evaluations: scopebench/run-evaluations.md
      - Inspect results: scopebench/results.md
      - Troubleshoot: scopebench/troubleshooting.md
  - Methodology:
      - Grading model: explanation/scopebench-grading.md
      - Architecture: explanation/architecture.md
      - Sandbox boundaries: explanation/sandbox-boundaries.md
      - Frozen task anatomy: scopebench/task-format.md
  - Reference:
      - CLI: reference/scopebench-cli.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
