name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run basedpyright
      - run: uv run pytest
      - run: uv build
      - run: >-
          uv run --isolated
          --with ./dist/agent_harness-0.1.0-py3-none-any.whl
          scopebench --help
