<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foliodesk Preview</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <h1>Foliodesk Preview</h1>
    <p>Document and release-artifact preview service.</p>
    <section>
      <h2>API</h2>
      <ul>
        <li><code>GET /api/docs</code> &mdash; list files in the document root</li>
        <li><code>GET /api/preview?file=&lt;name&gt;</code> &mdash; preview a document</li>
        <li><code>GET /api/diagnostics</code> &mdash; service diagnostics</li>
      </ul>
    </section>
  </main>
</body>
</html>
