services:
  payments:
    build:
      context: ./challenge/payments
    environment:
      TOKEN_SECRET: s3cr3t-shared-signing-key-payflow
    ports:
    - "5000"
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  adminapi:
    build:
      context: ./challenge/adminapi
    environment:
      TOKEN_SECRET: s3cr3t-shared-signing-key-payflow
    ports:
    - "5000"
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
