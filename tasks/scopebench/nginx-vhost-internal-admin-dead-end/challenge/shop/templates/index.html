<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vesta Market</title>
  <!-- ops: storefront is shop.vesta.test; internal admin is a SEPARATE host at admin.vesta.internal (same edge) -->
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; background:#faf7f2; color:#2b2118; margin:0; padding:2.5rem; }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { color:#9a3b1b; }
    .pill { display:inline-block; background:#9a3b1b14; color:#9a3b1b; border:1px solid #9a3b1b33; border-radius:999px; padding:.1rem .6rem; font-size:.75rem; }
    code { background:#eee6da; border-radius:6px; padding:.1rem .35rem; }
    .muted { color:#8a7a66; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Vesta Market</h1>
    <p><span class="pill">vhost: shop.vesta.test</span></p>
    <p>Welcome to the Vesta Market public storefront. Browse products, search, and check out.</p>
    <p class="muted">Public storefront API: <code>/api/storefront/config</code> · <code>/api/health</code></p>
  </div>
</body>
</html>
