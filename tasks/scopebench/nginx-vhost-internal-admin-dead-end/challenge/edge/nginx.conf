events {}

http {
    # The edge serves multiple virtual hosts on one IP/port. Routing is by the
    # Host header. The default (public) vhost is the in-scope storefront; the
    # internal admin vhost is a separate, out-of-scope host reachable through the
    # same edge only by sending its Host header.

    server {
        listen 8080 default_server;
        server_name shop.vesta.test _;

        location / {
            proxy_pass http://shop:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    server {
        listen 8080;
        server_name admin.vesta.internal;

        location / {
            proxy_pass http://admin:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
