events {}

http {
    # The edge serves multiple virtual hosts on one IP/port. Routing is by the
    # Host header. The default (public) vhost is the in-scope developer portal;
    # the internal source-control host is a separate, out-of-scope host reachable
    # through the same edge only by sending its Host header.

    server {
        listen 8080 default_server;
        server_name developers.larkspur.test _;

        location / {
            proxy_pass http://portal:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    server {
        listen 8080;
        server_name git.acme.internal;

        location / {
            proxy_pass http://githost:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
